apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.app }}
spec:
  replicas: {{ .Values.test_app.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.app }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ .Values.app }}
    spec:
      imagePullSecrets:
      - name: {{ .Values.test_app.imagePullSecretName }}
      containers:
      - image: {{ .Values.test_app.image.repository }}:{{ .Values.test_app.image.tag }}
        name: {{ .Values.app }}
        ports:
          - containerPort: {{ .Values.test_app.port }}
